<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configuración WiFi</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="page-wrapper">

    <!-- Partículas de fondo -->
    <canvas class="bg-canvas" id="bgCanvas" aria-hidden="true"></canvas>

    <main class="card">

      <!-- Header -->
      <div class="card__top">
        <div class="signal-bars" aria-hidden="true">
          <span class="bar bar--1"></span>
          <span class="bar bar--2"></span>
          <span class="bar bar--3"></span>
        </div>
        <div class="card__meta">
          <span class="card__label">RED INALÁMBRICA</span>
          <h1 class="card__title">Configuración<br>WiFi</h1>
        </div>
        <div class="card__status">
          <span class="status-dot"></span>
          <span class="status-text">Sin conectar</span>
        </div>
      </div>

      <!-- Línea divisora -->
      <div class="divider"></div>

      <!-- Formulario -->
      <form class="config-form" action="/guardar" method="GET">

        <!-- Riel lateral + campos -->
        <div class="fields-rail">
          <div class="rail-line" aria-hidden="true">
            <span class="rail-node rail-node--top"></span>
            <span class="rail-track"></span>
            <span class="rail-node rail-node--bottom"></span>
          </div>

          <div class="fields-stack">

            <!-- SSID -->
            <div class="field" id="field-ssid">
              <label class="field__label" for="ssid">
                <span class="field__label-text">Nombre de la red</span>
                <span class="field__tag">SSID</span>
              </label>
              <div class="field__wrap">
                <input
                  class="field__input"
                  id="ssid"
                  type="text"
                  name="ssid"
                  value="{{SSID}}"
                  placeholder="MiRedCasa_5G"
                  autocomplete="off"
                  spellcheck="false"
                  maxlength="32"
                />
                <span class="field__len" id="ssid-len" aria-hidden="true">0</span>
              </div>
            </div>

            <!-- Password -->
            <div class="field" id="field-password">
              <label class="field__label" for="password">
                <span class="field__label-text">Contraseña</span>
                <span class="field__tag">PASSWORD</span>
              </label>
              <div class="field__wrap">
                <input
                  class="field__input field__input--mono"
                  id="password"
                  type="password"
                  name="password"
                  value="{{PASSWORD}}"
                  placeholder="••••••••"
                  autocomplete="new-password"
                  spellcheck="false"
                  maxlength="63"
                />
                <button
                  type="button"
                  class="field__eye"
                  id="togglePass"
                  aria-label="Mostrar contraseña"
                >
                  <svg class="icon-eye" viewBox="0 0 24 24" fill="none">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="1.8"/>
                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
                  </svg>
                  <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" style="display:none">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" stroke="currentColor" stroke-width="1.8"/>
                    <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                  </svg>
                </button>
              </div>

              <!-- Fuerza de contraseña -->
              <div class="strength" id="strengthBox">
                <div class="strength__track">
                  <div class="strength__fill" id="strengthFill"></div>
                </div>
                <span class="strength__label" id="strengthLabel"></span>
              </div>
            </div>

          </div>
        </div>

        <!-- Botón -->
        <button type="submit" class="btn-save" id="btnSave">
          <span class="btn-save__inner">
            <svg class="btn-save__icon" viewBox="0 0 24 24" fill="none">
              <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="btn-save__text">Guardar configuración</span>
          </span>
          <span class="btn-save__shine" aria-hidden="true"></span>
        </button>

      </form>

    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
